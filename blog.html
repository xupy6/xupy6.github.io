<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="xupy 的个人博客，记录 Agent、LLM、AI4S、全栈工程和可交互式 AI 产品思考。"
    />
    <title>Blog | xupy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="blog-page">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <header class="site-header blog-sidebar">
      <a class="brand" href="./index.html#top" aria-label="xupy homepage">
        <span class="window-dots" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span>xupy</span>
      </a>

      <nav class="nav blog-nav" aria-label="Primary navigation">
        <span class="nav-liquid" aria-hidden="true"></span>
        <a href="./index.html">Home</a>
        <a href="./index.html#projects">Projects</a>
        <a class="active" href="./blog.html">Blog</a>
        <a href="./index.html#contact">Contact</a>
      </nav>

      <div class="blog-sidebar-foot">
        <span>Notes</span>
        <strong id="blogSidebarCount">--</strong>
      </div>
    </header>

    <main class="blog-main note-main">
      <section class="blog-hero">
        <div>
          <p class="eyebrow">Notebook</p>
          <h1>Notes</h1>
          <p class="note-brief">Agent、RAG、GraphRAG、AI4S 与产品工程记录。</p>
        </div>
        <a class="button secondary" href="./index.html">Back Home</a>
      </section>

      <section class="blog-layout">
        <div class="blog-list note-library glass">
          <div class="blog-list-head">
            <span>Library</span>
            <strong id="blogCount">Loading</strong>
          </div>
          <label class="blog-search">
            <span>Search</span>
            <input id="blogSearch" type="search" placeholder="Search notes..." autocomplete="off" />
          </label>
          <div class="blog-tag-filter" id="blogTagFilter" aria-label="Tag filters"></div>
          <div id="blogList" class="blog-list-body">
            <article class="blog-card">
              <span>Loading</span>
              <h2>正在读取 blogs 目录...</h2>
              <p>如果 GitHub API 正在限流，稍等一会儿刷新即可。</p>
            </article>
          </div>
        </div>

        <article id="blogPost" class="blog-post-panel glass">
          <div class="blog-empty">
            <p class="eyebrow">Select A Note</p>
            <h2>选择一篇笔记</h2>
            <p>从左侧列表选择文章，正文会在这里展开。</p>
          </div>
        </article>
      </section>
    </main>

    <footer>
      <span>Designed and built for xupy.</span>
      <a href="./index.html#top">Back to home</a>
    </footer>

    <script src="./blog.js"></script>
  </body>
</html>
